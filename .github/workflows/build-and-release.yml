name: Build, Package and Release

# - Push / PR to master:                  build and test only
# - Manual run (create_release unticked): build and test, binaries (as workflow artifacts) and Docker image tagged :dev
# - Manual run (create_release ticked)
#   or push of a v* tag:                  build and test, binaries, GitHub release and Docker image tagged
#                                         with the version and :latest (pre-release versions, e.g. v1.2.3-rc.1,
#                                         are marked as a pre-release and don't get :latest)

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a release (GitHub release with binaries, Docker image tagged :latest)'
        type: boolean
        default: false
      release_version:
        description: 'Version for the release (e.g., v1.0.0). Required when creating a release'
        type: string
        required: false
env:
  DOTNET_VERSION: '9.0.x'
  PROJECT_PATH: 'HadesMatrixBridge/HadesMatrixBridge.csproj'
  SOLUTION_PATH: 'HadesMatrixBridge.sln'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERFILE_PATH: 'HadesMatrixBridge/Dockerfile'

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.VERSION }}
      assembly_version: ${{ steps.set_version.outputs.ASSEMBLY_VERSION }}
      file_version: ${{ steps.set_version.outputs.FILE_VERSION }}
      informational_version: ${{ steps.set_version.outputs.INFORMATIONAL_VERSION }}
      release_tag: ${{ steps.set_version.outputs.RELEASE_TAG }}
      is_release: ${{ steps.set_version.outputs.IS_RELEASE }}
      is_prerelease: ${{ steps.set_version.outputs.IS_PRERELEASE }}
      publish: ${{ steps.set_version.outputs.PUBLISH }}

    steps:
    - name: Set version variables
      id: set_version
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF: ${{ github.ref }}
        REF_NAME: ${{ github.ref_name }}
        CREATE_RELEASE: ${{ inputs.create_release }}
        RELEASE_VERSION: ${{ inputs.release_version }}
        RUN_NUMBER: ${{ github.run_number }}
        SHA: ${{ github.sha }}
      run: |
        IS_RELEASE=false
        if [[ "$REF" == refs/tags/v* ]]; then
          IS_RELEASE=true
          RELEASE_TAG="$REF_NAME"
        elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$CREATE_RELEASE" == "true" ]]; then
          if [[ -z "$RELEASE_VERSION" ]]; then
            echo "::error::release_version is required when create_release is ticked"
            exit 1
          fi
          IS_RELEASE=true
          RELEASE_TAG="v${RELEASE_VERSION#v}"
        fi

        if [[ "$IS_RELEASE" == "true" ]]; then
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$VERSION' is not in the format 1.2.3 or 1.2.3-suffix"
            exit 1
          fi
          # Assembly/file versions must be numeric, so drop any pre-release suffix
          NUMERIC_VERSION="${VERSION%%-*}"
          ASSEMBLY_VERSION="$NUMERIC_VERSION.0"
          FILE_VERSION="$NUMERIC_VERSION.0"
          INFORMATIONAL_VERSION="$VERSION"
        else
          VERSION="1.0.0-dev.$RUN_NUMBER"
          ASSEMBLY_VERSION="1.0.0.0"
          FILE_VERSION="1.0.0.$RUN_NUMBER"
          INFORMATIONAL_VERSION="$VERSION+sha.$SHA"
        fi

        IS_PRERELEASE=false
        if [[ "$IS_RELEASE" == "true" && "$VERSION" == *-* ]]; then
          IS_PRERELEASE=true
        fi

        # Binaries and Docker images are only produced for manual runs and releases
        PUBLISH=false
        if [[ "$EVENT_NAME" == "workflow_dispatch" || "$IS_RELEASE" == "true" ]]; then
          PUBLISH=true
        fi

        {
          echo "VERSION=$VERSION"
          echo "ASSEMBLY_VERSION=$ASSEMBLY_VERSION"
          echo "FILE_VERSION=$FILE_VERSION"
          echo "INFORMATIONAL_VERSION=$INFORMATIONAL_VERSION"
          echo "RELEASE_TAG=${RELEASE_TAG:-}"
          echo "IS_RELEASE=$IS_RELEASE"
          echo "IS_PRERELEASE=$IS_PRERELEASE"
          echo "PUBLISH=$PUBLISH"
        } >> "$GITHUB_OUTPUT"

        echo "Using version: $VERSION (release: $IS_RELEASE, pre-release: $IS_PRERELEASE, publish: $PUBLISH)"

  build-and-test:
    name: Build and Test
    needs: version
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Build
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore -p:Version=${{ needs.version.outputs.version }} -p:AssemblyVersion=${{ needs.version.outputs.assembly_version }} -p:FileVersion=${{ needs.version.outputs.file_version }} -p:InformationalVersion=${{ needs.version.outputs.informational_version }}

    - name: Test
      run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --verbosity normal

  create-binaries:
    name: Create Binaries
    needs: [ version, build-and-test ]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    # Build Linux x64 binary
    - name: Build Linux x64
      run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -p:Version=${{ needs.version.outputs.version }} -p:AssemblyVersion=${{ needs.version.outputs.assembly_version }} -p:FileVersion=${{ needs.version.outputs.file_version }} -p:InformationalVersion=${{ needs.version.outputs.informational_version }} -o ./publish/linux-x64

    # Build Windows x64 binary
    - name: Build Windows x64
      run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -p:Version=${{ needs.version.outputs.version }} -p:AssemblyVersion=${{ needs.version.outputs.assembly_version }} -p:FileVersion=${{ needs.version.outputs.file_version }} -p:InformationalVersion=${{ needs.version.outputs.informational_version }} -o ./publish/win-x64

    # Create zip archives
    - name: Create archives
      run: |
        cd ./publish/linux-x64
        zip -r ../../HadesMatrixBridge-linux-x64.zip .
        cd ../win-x64
        zip -r ../../HadesMatrixBridge-win-x64.zip .
        cd ../..

    # Upload artifacts
    - name: Upload Linux artifact
      uses: actions/upload-artifact@v7
      with:
        name: hades-matrix-bridge-linux-x64
        path: HadesMatrixBridge-linux-x64.zip

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v7
      with:
        name: hades-matrix-bridge-win-x64
        path: HadesMatrixBridge-win-x64.zip

    # Create GitHub Release (creates the tag on this commit for manual releases)
    - name: Create Release
      if: needs.version.outputs.is_release == 'true'
      uses: softprops/action-gh-release@v3
      with:
        files: |
          HadesMatrixBridge-linux-x64.zip
          HadesMatrixBridge-win-x64.zip
        draft: false
        prerelease: ${{ needs.version.outputs.is_prerelease == 'true' }}
        name: ${{ needs.version.outputs.release_tag }}
        tag_name: ${{ needs.version.outputs.release_tag }}
        target_commitish: ${{ github.sha }}

  build-and-push-image:
    name: Build and Push Docker Image
    needs: [ version, build-and-test ]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Extract metadata (tags, labels) for Docker
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        flavor: |
          latest=false
        tags: |
          # Non-release (manual) builds
          type=raw,value=dev,enable=${{ needs.version.outputs.is_release != 'true' }}
          # Releases
          type=semver,pattern={{version}},value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.is_release == 'true' }}
          type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.is_release == 'true' && needs.version.outputs.is_prerelease != 'true' }}
          type=raw,value=latest,enable=${{ needs.version.outputs.is_release == 'true' && needs.version.outputs.is_prerelease != 'true' }}
          # Always tag with the commit, so any image can be traced back to its source
          type=sha

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ${{ env.DOCKERFILE_PATH }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          VERSION=${{ needs.version.outputs.version }}
          ASSEMBLY_VERSION=${{ needs.version.outputs.assembly_version }}
          FILE_VERSION=${{ needs.version.outputs.file_version }}
          INFORMATIONAL_VERSION=${{ needs.version.outputs.informational_version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
